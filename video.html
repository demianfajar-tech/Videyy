<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>S-Video — Video Pilihan</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #fff;
    color: #111;
    overflow-x: hidden;
}

/* HEADER */

.header {
    width: 100%;
    height: 88px;
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e8e8e8;
    background: #fff;
}

.logo {
    font-size: clamp(25px, 4vw, 38px);
    font-weight: 800;
    letter-spacing: -1px;
}

.upload-btn {
    border: none;
    background: #050505;
    color: #fff;
    padding: 15px 34px;
    border-radius: 50px;
    font-size: 17px;
    cursor: pointer;
    transition: .2s;
}

.upload-btn:hover {
    opacity: .8;
    transform: translateY(-2px);
}

#videoUpload {
    display: none;
}

/* MAIN */

.container {
    width: min(100% - 36px, 1000px);
    margin: auto;
    padding: 38px 0 70px;
}

/* VIDEO */

.video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
}

.video-wrapper video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}

/* CUSTOM VIDEO CONTROLS */

.video-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 12px 15px;
    color: #fff;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,.92)
    );
}

.progress-container {
    width: 100%;
    margin-bottom: 9px;
}

#seekBar {
    display: block;
    width: 100%;
    height: 5px;
    accent-color: #fff;
    cursor: pointer;
}

.control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.control-left,
.control-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.video-controls button {
    border: none;
    background: transparent;
    color: #fff;
    font-size: 17px;
    padding: 5px;
    cursor: pointer;
}

.video-controls button:hover {
    opacity: .7;
}

#videoTime {
    font-size: 12px;
    white-space: nowrap;
}

.volume-control {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 14px;
}

#volumeBar {
    width: 65px;
    accent-color: #fff;
    cursor: pointer;
}

#speedControl {
    background: #222;
    color: #fff;
    border: 1px solid #777;
    border-radius: 5px;
    padding: 5px;
    font-size: 12px;
    cursor: pointer;
}

#speedControl option {
    background: #222;
    color: #fff;
}

.video-wrapper:fullscreen {
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
    border-radius: 0;
}

.video-wrapper:fullscreen video {
    width: 100%;
    height: 100%;
}

/* VIDEO TITLE */

.video-title {
    margin-top: 28px;
    font-size: clamp(20px, 3vw, 27px);
    font-weight: 750;
    line-height: 1.3;
}

/* SHARE */

.share-area {
    display: flex;
    justify-content: center;
    margin-top: 34px;
}

.share-btn {
    border: none;
    background: #f0f0f0;
    color: #111;
    padding: 15px 26px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    cursor: pointer;
    transition: .2s;
}

.share-btn:hover {
    background: #e5e5e5;
}

.share-icon {
    font-size: 22px;
    font-weight: bold;
}

/* PHOTO SECTION */

.photo-section {
    margin-top: 58px;
    padding-top: 28px;
    border-top: 1px solid #e8e8e8;
}

.photo-heading {
    font-size: 23px;
    margin-bottom: 18px;
    font-weight: 750;
}

.photo-card {
    width: 100%;
    overflow: hidden;
    border-radius: 16px;
    background: #f2f2f2;
}

.photo-card img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 850px;
    object-fit: contain;
}

.photo-caption {
    margin-top: 12px;
    color: #777;
    font-size: 14px;
}

/* FOOTER */

.footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    padding: 35px 10px 15px;
}

/* TOAST */

.toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translate(-50%, 20px);
    background: #111;
    color: #fff;
    padding: 12px 18px;
    border-radius: 30px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: .2s;
    z-index: 999;
    text-align: center;
    max-width: 90%;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        height: 76px;
        padding: 0 18px;
    }

    .logo {
        font-size: 27px;
    }

    .upload-btn {
        padding: 12px 25px;
        font-size: 15px;
    }

    .container {
        width: calc(100% - 28px);
        padding-top: 30px;
    }

    .video-wrapper {
        border-radius: 14px;
    }

    .video-title {
        margin-top: 22px;
        font-size: 21px;
    }

    .share-area {
        margin-top: 27px;
    }

    .share-btn {
        padding: 13px 23px;
        font-size: 16px;
    }

    .photo-section {
        margin-top: 46px;
    }

    .photo-heading {
        font-size: 21px;
    }

    .video-controls {
        padding: 8px;
    }

    .control-left,
    .control-right {
        gap: 5px;
    }

    .video-controls button {
        font-size: 15px;
        padding: 4px;
    }

    #videoTime {
        font-size: 10px;
    }

    #volumeBar {
        width: 42px;
    }

    #speedControl {
        font-size: 11px;
        padding: 4px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

    <h1 class="logo">S-Video</h1>

    <button class="upload-btn" id="uploadButton">
        Upload
    </button>

    <input
        type="file"
        id="videoUpload"
        accept="video/*"
    >

</header>


<main class="container">

    <!-- VIDEO PLAYER -->

    <section>

        <div class="video-wrapper" id="videoWrapper">

            <video
                id="mainVideo"
                playsinline
                preload="metadata"
            >
                <source src="video.mp4" type="video/mp4">
                Browser tidak mendukung pemutar video.
            </video>

            <!-- CUSTOM CONTROLS -->

            <div class="video-controls">

                <div class="progress-container">

                    <input
                        type="range"
                        id="seekBar"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                        aria-label="Posisi video"
                    >

                </div>

                <div class="control-row">

                    <div class="control-left">

                        <button id="backwardBtn" aria-label="Mundur 10 detik">
                            ↶10
                        </button>

                        <button id="playPauseBtn" aria-label="Putar video">
                            ▶
                        </button>

                        <button id="forwardBtn" aria-label="Maju 10 detik">
                            10↷
                        </button>

                        <span id="videoTime">
                            0:00 / 0:00
                        </span>

                    </div>

                    <div class="control-right">

                        <label class="volume-control">
                            <span>🔊</span>

                            <input
                                type="range"
                                id="volumeBar"
                                min="0"
                                max="1"
                                step="0.05"
                                value="1"
                                aria-label="Volume"
                            >
                        </label>

                        <select id="speedControl" aria-label="Kecepatan video">
                            <option value="0.5">0.5x</option>
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>1x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>

                        <button id="fullscreenBtn" aria-label="Layar penuh">
                            ⛶
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <h2 class="video-title" id="videoTitle">
            VIDEO TERBARU 2026
        </h2>
      <p>guys klo nyari foto ada di bawah ya</p>

        <div class="share-area">

            <button class="share-btn" id="shareButton">
                <span class="share-icon">↥</span>
                <span>Share video</span>
            </button>

        </div>

    </section>


    <!-- FOTO UNIK -->

    <section class="photo-section">

        <h2 class="photo-heading">
            Foto Pilihan
        </h2>

        <div class="photo-card">

            <img
                src="foto.jpg"
                alt="Foto pilihan"
                loading="lazy"
            >

        </div>

        <p class="photo-caption">
            Koleksi foto pilihan S-Video.
        </p>

    </section>


    <footer class="footer">
        © 2026 S-Video
    </footer>

</main>


<div class="toast" id="toast"></div>


<script>

/* ELEMENT */

const video = document.getElementById("mainVideo");
const videoWrapper = document.getElementById("videoWrapper");

const uploadButton = document.getElementById("uploadButton");
const videoUpload = document.getElementById("videoUpload");

const shareButton = document.getElementById("shareButton");
const toast = document.getElementById("toast");

const playPauseBtn = document.getElementById("playPauseBtn");
const backwardBtn = document.getElementById("backwardBtn");
const forwardBtn = document.getElementById("forwardBtn");

const seekBar = document.getElementById("seekBar");
const volumeBar = document.getElementById("volumeBar");
const speedControl = document.getElementById("speedControl");

const fullscreenBtn = document.getElementById("fullscreenBtn");
const videoTime = document.getElementById("videoTime");

let uploadedVideoUrl = null;


/* TOAST */

function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2300);

}


/* FORMAT WAKTU */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) return "0:00";

    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);

    return `\( {minutes}: \){String(secs).padStart(2, "0")}`;

}


/* UPDATE KONTROL VIDEO */

function updateVideoControls() {

    const duration = video.duration || 0;
    const current = video.currentTime || 0;

    seekBar.value = duration
        ? (current / duration) * 100
        : 0;

    videoTime.textContent =
        `${formatTime(current)} / ${formatTime(duration)}`;

}

video.addEventListener("loadedmetadata", updateVideoControls);
video.addEventListener("timeupdate", updateVideoControls);


/* PLAY / PAUSE */

playPauseBtn.addEventListener("click", () => {

    if (video.paused) {

        video.play().catch(() => {
            showToast("Video tidak dapat diputar.");
        });

    } else {

        video.pause();

    }

});

video.addEventListener("play", () => {
    playPauseBtn.textContent = "Ⅱ";
    playPauseBtn.setAttribute("aria-label", "Jeda video");
});

video.addEventListener("pause", () => {
    playPauseBtn.textContent = "▶";
    playPauseBtn.setAttribute("aria-label", "Putar video");
});

video.addEventListener("ended", () => {
    playPauseBtn.textContent = "▶";
});


/* MUNDUR DAN MAJU */

backwardBtn.addEventListener("click", () => {

    video.currentTime = Math.max(
        0,
        video.currentTime - 10
    );

});

forwardBtn.addEventListener("click", () => {

    if (!Number.isFinite(video.duration)) return;

    video.currentTime = Math.min(
        video.duration,
        video.currentTime + 10
    );

});


/* SEEK BAR */

seekBar.addEventListener("input", () => {

    if (Number.isFinite(video.duration)) {

        video.currentTime =
            (Number(seekBar.value) / 100) * video.duration;

    }

});


/* VOLUME */

volumeBar.addEventListener("input", () => {

    video.volume = Number(volumeBar.value);

    video.muted = video.volume === 0;

});


/* KECEPATAN VIDEO */

speedControl.addEventListener("change", () => {

    video.playbackRate = Number(speedControl.value);

});


/* FULLSCREEN */

fullscreenBtn.addEventListener("click", async () => {

    try {

        if (!document.fullscreenElement) {

            if (videoWrapper.requestFullscreen) {
                await videoWrapper.requestFullscreen();
            } else if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            } else {
                showToast("Fullscreen tidak didukung browser ini.");
            }

        } else {

            await document.exitFullscreen();

        }

    } catch (error) {

        showToast("Fullscreen tidak tersedia.");

    }

});


/* UPLOAD VIDEO */

uploadButton.addEventListener("click", () => {

    videoUpload.click();

});


videoUpload.addEventListener("change", () => {

    const file = videoUpload.files[0];

    if (!file) return;

    if (!file.type.startsWith("video/")) {

        showToast("Pilih file video yang valid.");

        videoUpload.value = "";

        return;

    }

    if (uploadedVideoUrl) {
        URL.revokeObjectURL(uploadedVideoUrl);
    }

    uploadedVideoUrl = URL.createObjectURL(file);

    video.src = uploadedVideoUrl;
    video.load();

    document.getElementById("videoTitle").textContent =
        file.name
            .replace(/\.[^.]+$/, "")
            .replace(/[_-]+/g, " ");

    playPauseBtn.textContent = "▶";
    seekBar.value = 0;

    showToast("Video berhasil dimuat.");

});


/* SHARE VIDEO */

shareButton.addEventListener("click", async () => {

    const shareData = {

        title: document.title,

        text: document.getElementById("videoTitle").textContent,

        url: location.href

    };

    try {

        if (navigator.share) {

            await navigator.share(shareData);

        } else if (navigator.clipboard) {

            await navigator.clipboard.writeText(location.href);

            showToast("Link berhasil disalin.");

        } else {

            showToast("Fitur berbagi tidak tersedia.");

        }

    } catch (error) {

        if (error.name !== "AbortError") {
            showToast("Gagal membagikan halaman.");
        }

    }

});


/* BERSIHKAN URL UPLOAD */

window.addEventListener("beforeunload", () => {

    if (uploadedVideoUrl) {
        URL.revokeObjectURL(uploadedVideoUrl);
    }

});

</script>

</body>
</html>
